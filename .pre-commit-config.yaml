# Modern pre-commit configuration for 2024-2025
# See https://pre-commit.com for more information
repos:
  # Ruff, mypy, and bandit run from the project environment (uv.lock) with the
  # same commands as .github/workflows/ci.yml, so pre-commit, CI, and
  # scripts/check-ci.sh cannot drift apart in tool versions or flags.
  # Requires `uv sync --all-extras`.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (formatter)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src/ --no-strict-optional
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -r src/ -q
        language: system
        types: [python]
        pass_filenames: false

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
      - id: end-of-file-fixer
        name: fix end of files
      - id: check-yaml
        name: check yaml syntax
      - id: check-toml
        name: check toml syntax
      - id: check-json
        name: check json syntax
      - id: check-added-large-files
        name: check for added large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: check for merge conflicts
      - id: debug-statements
        name: debug statements (Python)
      - id: check-docstring-first
        name: check docstring is first

  # Local CI Simulation (pre-push hook)
  - repo: local
    hooks:
      - id: ci-simulation
        name: Run CI simulation before push
        entry: ./scripts/check-ci.sh
        args: [--fast]
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true

  # Conventional commits (optional but recommended)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]

# Global configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
